name: CI PHP

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  php:
    name: PHP Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP Lint
        run: |
          set -e
          find backend -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done

      # ---- DOCKER ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect compose file
        id: compose
        run: |
          if [ -f "Docker-compose.yml" ]; then
            echo "file=Docker-compose.yml" >> $GITHUB_OUTPUT
            echo "✓ Found Docker-compose.yml"
          elif [ -f "docker-compose.yml" ]; then
            echo "file=docker-compose.yml" >> $GITHUB_OUTPUT
            echo "✓ Found docker-compose.yml"
          elif [ -f "compose.yml" ]; then
            echo "file=compose.yml" >> $GITHUB_OUTPUT
            echo "✓ Found compose.yml"
          else
            echo "❌ No compose file found"
            ls -la
            exit 1
          fi

      # ---- TEST DOCKER CONTAINERS ----
      - name: Setup environment
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "Warning: .env.example not found, creating minimal .env"
            touch .env
          fi

      - name: Start Docker containers
        run: |
          docker compose -f ${{ steps.compose.outputs.file }} up --build -d
          sleep 10

      - name: Check database health
        run: |
          if [ $(docker inspect -f '{{.State.Health.Status}}' contacts_db) != "healthy" ]; then
            echo "Database container is not healthy"
            docker compose -f ${{ steps.compose.outputs.file }} logs db
            exit 1
          fi

      - name: Check containers are running
        run: |
          docker ps
          docker ps | grep -q 'contacts_frontend' || exit 1
          docker ps | grep -q 'contacts_backend' || exit 1

      - name: Check API endpoint
        run: |
          RESPONSE_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:8080/api/contacts.php)
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "API error: $RESPONSE_CODE"
            docker compose -f ${{ steps.compose.outputs.file }} logs backend
            exit 1
          fi

      - name: Check frontend endpoint
        run: |
          RESPONSE_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000)
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Frontend error: $RESPONSE_CODE"
            docker compose -f ${{ steps.compose.outputs.file }} logs frontend
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f "${{ steps.compose.outputs.file }}" ]; then
            docker compose -f ${{ steps.compose.outputs.file }} down -v
          else
            echo "No compose file found, skipping cleanup"
          fi